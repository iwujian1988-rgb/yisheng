<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>找回密码 - 病历传输</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            background: #F5F7FA;
        }

        .phone-container {
            width: 375px;
            height: 812px;
            margin: 20px auto;
            background: #FFFFFF;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            position: relative;
        }

        /* 状态栏 */
        .status-bar {
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 14px;
            color: #333;
        }

        /* 导航栏 */
        .nav-bar {
            height: 44px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid #F0F0F0;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 16px;
            color: #333;
            cursor: pointer;
        }

        .back-icon {
            width: 20px;
            height: 20px;
        }

        .nav-title {
            flex: 1;
            text-align: center;
            font-size: 17px;
            font-weight: 500;
            color: #333;
        }

        /* 内容区域 */
        .content {
            padding: 32px;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #999;
            margin-bottom: 40px;
        }

        /* 步骤指示器 */
        .steps {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
            gap: 8px;
        }

        .step {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #E5E5E5;
            color: #999;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 500;
        }

        .step.active {
            background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
            color: #FFFFFF;
        }

        .step-line {
            width: 60px;
            height: 2px;
            background: #E5E5E5;
        }

        .step-line.active {
            background: #E5E5E5;
        }

        /* 表单区域 */
        .input-group {
            margin-bottom: 24px;
        }

        .input-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input {
            width: 100%;
            height: 52px;
            padding: 0 16px;
            background-color: #F5F7FA;
            border: 1px solid transparent;
            border-radius: 12px;
            font-size: 15px;
            color: #333;
            transition: all 0.3s;
        }

        .input:focus {
            outline: none;
            background-color: #FFFFFF;
            border-color: #4A90E2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }

        .input::placeholder {
            color: #CCCCCC;
        }

        /* 验证码输入框 */
        .code-wrapper {
            display: flex;
            gap: 12px;
        }

        .code-wrapper .input {
            flex: 1;
        }

        .code-btn {
            width: 110px;
            height: 52px;
            background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .code-btn:disabled {
            background: #CCCCCC;
            cursor: not-allowed;
        }

        .code-btn.countdown {
            background: #F5F7FA;
            color: #999;
        }

        /* 按钮样式 */
        .btn {
            width: 100%;
            height: 52px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 24px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
            color: #FFFFFF;
        }

        .btn-primary:hover:not(.disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(74, 144, 226, 0.3);
        }

        .btn-primary.disabled {
            background: #CCCCCC;
            cursor: not-allowed;
        }

        /* 提示框 */
        .toast {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 16px 24px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 100;
        }

        .toast.show {
            opacity: 1;
        }

        /* 提示信息 */
        .tip {
            font-size: 13px;
            color: #999;
            margin-top: 16px;
            line-height: 1.6;
        }

        @media (max-width: 400px) {
            .phone-container {
                width: 100%;
                height: 100vh;
                margin: 0;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <!-- 状态栏 -->
        <div class="status-bar">
            <span>9:41</span>
            <span>📶 🔋</span>
        </div>

        <!-- 导航栏 -->
        <div class="nav-bar">
            <div class="back-btn">
                <svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 18l-6-6 6-6"/>
                </svg>
                <span>返回</span>
            </div>
            <div class="nav-title">找回密码</div>
            <div style="width: 60px;"></div>
        </div>

        <!-- 内容区域 -->
        <div class="content">
            <div class="title">找回密码</div>
            <div class="subtitle">通过手机验证码重置密码</div>

            <!-- 步骤指示器 -->
            <div class="steps">
                <div class="step active">1</div>
                <div class="step-line"></div>
                <div class="step">2</div>
            </div>

            <!-- 步骤1：验证手机号 -->
            <div class="input-group">
                <div class="input-label">手机号</div>
                <div class="input-wrapper">
                    <input type="tel" class="input" id="phone" placeholder="请输入注册时的手机号" maxlength="11">
                </div>
            </div>

            <div class="input-group">
                <div class="input-label">验证码</div>
                <div class="code-wrapper">
                    <input type="text" class="input" id="code" placeholder="请输入验证码" maxlength="6">
                    <button class="code-btn" id="codeBtn">获取验证码</button>
                </div>
            </div>

            <button class="btn btn-primary disabled" id="nextBtn">下一步</button>

            <div class="tip">
                验证码将发送至您的注册手机号，请注意查收
            </div>
        </div>

        <!-- 提示框 -->
        <div class="toast" id="toast"></div>
    </div>

    <script>
        // 获取元素
        const phoneInput = document.getElementById('phone');
        const codeInput = document.getElementById('code');
        const codeBtn = document.getElementById('codeBtn');
        const nextBtn = document.getElementById('nextBtn');
        const toast = document.getElementById('toast');

        let countdown = 0;
        let countdownTimer = null;

        // 显示提示
        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // 验证手机号
        function validatePhone(phone) {
            return /^1[3-9]\d{9}$/.test(phone);
        }

        // 检查是否可以下一步
        function checkCanNext() {
            const phone = phoneInput.value.trim();
            const code = codeInput.value.trim();
            const canNext = validatePhone(phone) && code.length === 6;

            if (canNext) {
                nextBtn.classList.remove('disabled');
            } else {
                nextBtn.classList.add('disabled');
            }
        }

        // 手机号输入
        phoneInput.addEventListener('input', checkCanNext);

        // 验证码输入
        codeInput.addEventListener('input', checkCanNext);

        // 获取验证码
        codeBtn.addEventListener('click', () => {
            const phone = phoneInput.value.trim();

            if (!validatePhone(phone)) {
                showToast('请输入正确的手机号');
                return;
            }

            // 开始倒计时
            countdown = 60;
            codeBtn.disabled = true;
            codeBtn.classList.add('countdown');
            codeBtn.textContent = '60s';

            countdownTimer = setInterval(() => {
                countdown--;
                codeBtn.textContent = `${countdown}s`;

                if (countdown <= 0) {
                    clearInterval(countdownTimer);
                    codeBtn.disabled = false;
                    codeBtn.classList.remove('countdown');
                    codeBtn.textContent = '获取验证码';
                }
            }, 1000);

            showToast('验证码已发送');
        });

        // 下一步按钮
        nextBtn.addEventListener('click', () => {
            if (nextBtn.classList.contains('disabled')) return;

            showToast('验证成功');
            setTimeout(() => {
                window.location.href = 'forget-password-step2.html';
            }, 1000);
        });

        // 返回按钮
        document.querySelector('.back-btn').addEventListener('click', () => {
            showToast('返回登录页');
        });
    </script>
</body>
</html>
