<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>注册 - 病历传输</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            background: #F5F7FA;
        }

        .phone-container {
            width: 375px;
            height: 812px;
            margin: 20px auto;
            background: #FFFFFF;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            position: relative;
        }

        /* 状态栏 */
        .status-bar {
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 14px;
            color: #333;
        }

        /* 导航栏 */
        .nav-bar {
            height: 44px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid #F0F0F0;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 16px;
            color: #333;
            cursor: pointer;
        }

        .back-icon {
            width: 20px;
            height: 20px;
        }

        .nav-title {
            flex: 1;
            text-align: center;
            font-size: 17px;
            font-weight: 500;
            color: #333;
        }

        /* 表单区域 */
        .form-section {
            padding: 32px;
        }

        .form-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .form-subtitle {
            font-size: 14px;
            color: #999;
            margin-bottom: 40px;
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input {
            width: 100%;
            height: 52px;
            padding: 0 16px;
            background-color: #F5F7FA;
            border: 1px solid transparent;
            border-radius: 12px;
            font-size: 15px;
            color: #333;
            transition: all 0.3s;
        }

        .input:focus {
            outline: none;
            background-color: #FFFFFF;
            border-color: #4A90E2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }

        .input::placeholder {
            color: #CCCCCC;
        }

        /* 验证码输入框 */
        .code-wrapper {
            display: flex;
            gap: 12px;
        }

        .code-wrapper .input {
            flex: 1;
        }

        .code-btn {
            width: 110px;
            height: 52px;
            background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .code-btn:disabled {
            background: #CCCCCC;
            cursor: not-allowed;
        }

        .code-btn.countdown {
            background: #F5F7FA;
            color: #999;
        }

        /* 按钮样式 */
        .btn {
            width: 100%;
            height: 52px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 40px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
            color: #FFFFFF;
        }

        .btn-primary:hover:not(.disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(74, 144, 226, 0.3);
        }

        .btn-primary.disabled {
            background: #CCCCCC;
            cursor: not-allowed;
        }

        /* 协议区域 */
        .agreement-section {
            padding: 0 32px;
            margin-top: 32px;
        }

        .agreement-label {
            display: flex;
            align-items: flex-start;
            font-size: 13px;
            gap: 8px;
        }

        .agreement-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin-top: 2px;
            accent-color: #4A90E2;
        }

        .agreement-text {
            color: #666666;
        }

        .agreement-link {
            color: #4A90E2;
            cursor: pointer;
        }

        /* 提示框 */
        .toast {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 16px 24px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 100;
        }

        .toast.show {
            opacity: 1;
        }

        /* 步骤指示器 */
        .step-indicator {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 32px;
            gap: 8px;
        }

        .step-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #E5E5E5;
            transition: all 0.3s;
        }

        .step-dot.active {
            width: 24px;
            background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
        }

        .step-dot.completed {
            background: #52C41A;
        }

        @media (max-width: 400px) {
            .phone-container {
                width: 100%;
                height: 100vh;
                margin: 0;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <!-- 状态栏 -->
        <div class="status-bar">
            <span>9:41</span>
            <span>📶 🔋</span>
        </div>

        <!-- 导航栏 -->
        <div class="nav-bar">
            <div class="back-btn">
                <svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 18l-6-6 6-6"/>
                </svg>
                <span>返回</span>
            </div>
            <div class="nav-title">注册</div>
            <div style="width: 60px;"></div>
        </div>

        <!-- 表单区域 -->
        <div class="form-section">
            <!-- 步骤指示器 -->
            <div class="step-indicator">
                <div class="step-dot active"></div>
                <div class="step-dot"></div>
            </div>

            <div class="form-title">创建新账号</div>
            <div class="form-subtitle">步骤 1/2：验证手机号</div>

            <!-- 手机号 -->
            <div class="input-group">
                <div class="input-label">手机号</div>
                <div class="input-wrapper">
                    <input type="tel" class="input" id="phone" placeholder="请输入手机号" maxlength="11">
                </div>
            </div>

            <!-- 验证码 -->
            <div class="input-group">
                <div class="input-label">验证码</div>
                <div class="code-wrapper">
                    <input type="text" class="input" id="code" placeholder="请输入验证码" maxlength="6">
                    <button class="code-btn" id="codeBtn">获取验证码</button>
                </div>
            </div>

            <!-- 下一步按钮 -->
            <button class="btn btn-primary disabled" id="nextBtn">下一步</button>

            <!-- 协议区域 -->
            <div class="agreement-section">
                <label class="agreement-label">
                    <input type="checkbox" id="agreement" checked>
                    <span class="agreement-text">我已阅读并同意</span>
                    <span class="agreement-link">《用户协议》</span>
                    <span class="agreement-text">和</span>
                    <span class="agreement-link">《隐私政策》</span>
                </label>
            </div>
        </div>

        <!-- 提示框 -->
        <div class="toast" id="toast"></div>
    </div>

    <script>
        // 获取元素
        const phoneInput = document.getElementById('phone');
        const codeInput = document.getElementById('code');
        const codeBtn = document.getElementById('codeBtn');
        const nextBtn = document.getElementById('nextBtn');
        const agreementCheckbox = document.getElementById('agreement');
        const toast = document.getElementById('toast');

        // 状态
        let agreed = true;
        let countdown = 0;
        let countdownTimer = null;

        // 显示提示
        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // 验证手机号
        function validatePhone(phone) {
            return /^1[3-9]\d{9}$/.test(phone);
        }

        // 检查是否可以下一步
        function checkCanNext() {
            const phone = phoneInput.value.trim();
            const code = codeInput.value.trim();
            const canNext = validatePhone(phone) && code.length === 6 && agreed;

            if (canNext) {
                nextBtn.classList.remove('disabled');
            } else {
                nextBtn.classList.add('disabled');
            }
        }

        // 手机号输入
        phoneInput.addEventListener('input', checkCanNext);

        // 验证码输入
        codeInput.addEventListener('input', checkCanNext);

        // 获取验证码
        codeBtn.addEventListener('click', () => {
            const phone = phoneInput.value.trim();

            if (!validatePhone(phone)) {
                showToast('请输入正确的手机号');
                return;
            }

            // 开始倒计时
            countdown = 60;
            codeBtn.disabled = true;
            codeBtn.classList.add('countdown');
            codeBtn.textContent = '60s';

            countdownTimer = setInterval(() => {
                countdown--;
                codeBtn.textContent = `${countdown}s`;

                if (countdown <= 0) {
                    clearInterval(countdownTimer);
                    codeBtn.disabled = false;
                    codeBtn.classList.remove('countdown');
                    codeBtn.textContent = '获取验证码';
                }
            }, 1000);

            showToast('验证码已发送');
        });

        // 协议勾选
        agreementCheckbox.addEventListener('change', (e) => {
            agreed = e.target.checked;
            checkCanNext();
        });

        // 下一步按钮
        nextBtn.addEventListener('click', () => {
            if (nextBtn.classList.contains('disabled')) return;

            if (!agreed) {
                showToast('请先同意用户协议和隐私政策');
                return;
            }

            showToast('验证成功，跳转到设置密码页...');
            // 实际开发中这里会跳转到 register-step2.html
            setTimeout(() => {
                window.location.href = 'register-step2.html';
            }, 1500);
        });

        // 返回按钮
        document.querySelector('.back-btn').addEventListener('click', () => {
            showToast('返回登录页');
        });

        // 协议链接
        document.querySelectorAll('.agreement-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.stopPropagation();
                const type = link.textContent.includes('用户协议') ? '用户协议' : '隐私政策';
                showToast(`查看${type}`);
            });
        });
    </script>
</body>
</html>
