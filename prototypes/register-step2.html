<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>设置密码 - 病历传输</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            background: #F5F7FA;
        }

        .phone-container {
            width: 375px;
            height: 812px;
            margin: 20px auto;
            background: #FFFFFF;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            position: relative;
        }

        /* 状态栏 */
        .status-bar {
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 14px;
            color: #333;
        }

        /* 导航栏 */
        .nav-bar {
            height: 44px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid #F0F0F0;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 16px;
            color: #333;
            cursor: pointer;
        }

        .back-icon {
            width: 20px;
            height: 20px;
        }

        .nav-title {
            flex: 1;
            text-align: center;
            font-size: 17px;
            font-weight: 500;
            color: #333;
        }

        /* 表单区域 */
        .form-section {
            padding: 32px;
        }

        .form-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .form-subtitle {
            font-size: 14px;
            color: #999;
            margin-bottom: 40px;
        }

        .phone-display {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 16px;
            background: #F5F7FA;
            border-radius: 12px;
            margin-bottom: 32px;
        }

        .phone-icon {
            width: 20px;
            height: 20px;
            fill: #4A90E2;
        }

        .phone-number {
            font-size: 15px;
            color: #333;
        }

        .phone-change {
            font-size: 14px;
            color: #4A90E2;
            margin-left: auto;
            cursor: pointer;
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input {
            width: 100%;
            height: 52px;
            padding: 0 48px 0 16px;
            background-color: #F5F7FA;
            border: 1px solid transparent;
            border-radius: 12px;
            font-size: 15px;
            color: #333;
            transition: all 0.3s;
        }

        .input:focus {
            outline: none;
            background-color: #FFFFFF;
            border-color: #4A90E2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }

        .input::placeholder {
            color: #CCCCCC;
        }

        /* 眼睛图标 */
        .eye-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            cursor: pointer;
            fill: #999;
            transition: fill 0.3s;
        }

        .eye-icon:hover {
            fill: #4A90E2;
        }

        /* 密码强度提示 */
        .password-strength {
            display: flex;
            gap: 4px;
            margin-top: 8px;
        }

        .strength-bar {
            flex: 1;
            height: 4px;
            background: #E5E5E5;
            border-radius: 2px;
            transition: background 0.3s;
        }

        .strength-bar.active {
            background: #52C41A;
        }

        .strength-tip {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
        }

        /* 按钮样式 */
        .btn {
            width: 100%;
            height: 52px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 40px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
            color: #FFFFFF;
        }

        .btn-primary:hover:not(.disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(74, 144, 226, 0.3);
        }

        .btn-primary.disabled {
            background: #CCCCCC;
            cursor: not-allowed;
        }

        /* 提示框 */
        .toast {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 16px 24px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 100;
        }

        .toast.show {
            opacity: 1;
        }

        /* 成功弹窗 */
        .success-modal {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            z-index: 200;
        }

        .success-modal.show {
            opacity: 1;
            visibility: visible;
        }

        .success-content {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 32px;
            text-align: center;
            width: 280px;
            transform: scale(0.9);
            transition: transform 0.3s;
        }

        .success-modal.show .success-content {
            transform: scale(1);
        }

        .success-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, #52C41A 0%, #389E0D 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success-icon svg {
            width: 32px;
            height: 32px;
            fill: white;
        }

        .success-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .success-desc {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .success-gift {
            font-size: 16px;
            color: #FAAD14;
            font-weight: 500;
            margin-bottom: 24px;
        }

        .success-btn {
            width: 100%;
            height: 48px;
            background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
        }

        /* 步骤指示器 */
        .step-indicator {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 32px;
            gap: 8px;
        }

        .step-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #E5E5E5;
            transition: all 0.3s;
        }

        .step-dot.completed {
            background: #52C41A;
        }

        .step-dot.active {
            width: 24px;
            background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
        }

        @media (max-width: 400px) {
            .phone-container {
                width: 100%;
                height: 100vh;
                margin: 0;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <!-- 状态栏 -->
        <div class="status-bar">
            <span>9:41</span>
            <span>📶 🔋</span>
        </div>

        <!-- 导航栏 -->
        <div class="nav-bar">
            <div class="back-btn">
                <svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 18l-6-6 6-6"/>
                </svg>
                <span>返回</span>
            </div>
            <div class="nav-title">注册</div>
            <div style="width: 60px;"></div>
        </div>

        <!-- 表单区域 -->
        <div class="form-section">
            <!-- 步骤指示器 -->
            <div class="step-indicator">
                <div class="step-dot completed"></div>
                <div class="step-dot active"></div>
            </div>

            <div class="form-title">创建新账号</div>
            <div class="form-subtitle">步骤 2/2：设置密码</div>

            <!-- 手机号显示 -->
            <div class="phone-display">
                <svg class="phone-icon" viewBox="0 0 24 24">
                    <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
                </svg>
                <span class="phone-number">138****8888</span>
                <span class="phone-change">更换</span>
            </div>

            <!-- 设置密码 -->
            <div class="input-group">
                <div class="input-label">设置密码</div>
                <div class="input-wrapper">
                    <input type="password" class="input" id="password" placeholder="6-20位，包含字母和数字" maxlength="20">
                    <svg class="eye-icon" id="eyeIcon" viewBox="0 0 24 24">
                        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                    </svg>
                </div>
                <div class="password-strength">
                    <div class="strength-bar" id="strength1"></div>
                    <div class="strength-bar" id="strength2"></div>
                    <div class="strength-bar" id="strength3"></div>
                </div>
                <div class="strength-tip" id="strengthTip">密码需6-20位，包含字母和数字</div>
            </div>

            <!-- 完成注册按钮 -->
            <button class="btn btn-primary disabled" id="registerBtn">完成注册</button>
        </div>

        <!-- 提示框 -->
        <div class="toast" id="toast"></div>

        <!-- 成功弹窗 -->
        <div class="success-modal" id="successModal">
            <div class="success-content">
                <div class="success-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                    </svg>
                </div>
                <div class="success-title">注册成功</div>
                <div class="success-desc">欢迎加入病历传输</div>
                <div class="success-gift">🎁 送您7天免费体验</div>
                <button class="success-btn" id="successBtn">立即体验</button>
            </div>
        </div>
    </div>

    <script>
        // 获取元素
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');
        const registerBtn = document.getElementById('registerBtn');
        const toast = document.getElementById('toast');
        const successModal = document.getElementById('successModal');
        const successBtn = document.getElementById('successBtn');

        // 状态
        let showPassword = false;

        // 显示提示
        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // 验证密码
        function validatePassword(pwd) {
            return /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{6,20}$/.test(pwd);
        }

        // 更新密码强度
        function updatePasswordStrength(pwd) {
            const strength1 = document.getElementById('strength1');
            const strength2 = document.getElementById('strength2');
            const strength3 = document.getElementById('strength3');
            const strengthTip = document.getElementById('strengthTip');

            strength1.classList.remove('active');
            strength2.classList.remove('active');
            strength3.classList.remove('active');

            if (pwd.length === 0) {
                strengthTip.textContent = '密码需6-20位，包含字母和数字';
                return;
            }

            let strength = 0;
            if (pwd.length >= 6) strength++;
            if (pwd.length >= 10) strength++;
            if (/[A-Z]/.test(pwd) && /[a-z]/.test(pwd) && /\d/.test(pwd)) strength++;

            if (strength >= 1) strength1.classList.add('active');
            if (strength >= 2) strength2.classList.add('active');
            if (strength >= 3) strength3.classList.add('active');

            const tips = ['密码较弱', '密码中等', '密码较强'];
            const colors = ['#F5222D', '#FAAD14', '#52C41A'];
            strengthTip.textContent = tips[strength - 1] || '密码需6-20位，包含字母和数字';
            strengthTip.style.color = colors[strength - 1] || '#999';
        }

        // 检查是否可以注册
        function checkCanRegister() {
            const password = passwordInput.value;
            const canRegister = validatePassword(password);

            if (canRegister) {
                registerBtn.classList.remove('disabled');
            } else {
                registerBtn.classList.add('disabled');
            }
        }

        // 切换密码显示
        eyeIcon.addEventListener('click', () => {
            showPassword = !showPassword;
            passwordInput.type = showPassword ? 'text' : 'password';
            eyeIcon.style.fill = showPassword ? '#4A90E2' : '#999';
        });

        // 密码输入
        passwordInput.addEventListener('input', () => {
            const password = passwordInput.value;
            updatePasswordStrength(password);
            checkCanRegister();
        });

        // 注册按钮
        registerBtn.addEventListener('click', () => {
            if (registerBtn.classList.contains('disabled')) return;

            // 显示成功弹窗
            successModal.classList.add('show');
        });

        // 成功弹窗按钮
        successBtn.addEventListener('click', () => {
            successModal.classList.remove('show');
            showToast('即将跳转到首页...');
        });

        // 返回按钮
        document.querySelector('.back-btn').addEventListener('click', () => {
            showToast('返回上一步');
            setTimeout(() => {
                window.location.href = 'register-step1.html';
            }, 1000);
        });

        // 更换手机号
        document.querySelector('.phone-change').addEventListener('click', () => {
            showToast('返回验证手机号页');
            setTimeout(() => {
                window.location.href = 'register-step1.html';
            }, 1000);
        });
    </script>
</body>
</html>
