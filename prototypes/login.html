<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>登录 - 病历传输</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            background: #F5F7FA;
        }

        /* 手机模拟容器 */
        .phone-container {
            width: 375px;
            height: 812px;
            margin: 20px auto;
            background: linear-gradient(180deg, #FFFFFF 0%, #F5F7FA 100%);
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            position: relative;
        }

        /* 状态栏 */
        .status-bar {
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 14px;
            color: #333;
        }

        /* Logo区域 */
        .logo-section {
            margin-top: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            fill: white;
        }

        .app-name {
            font-size: 28px;
            font-weight: bold;
            color: #333333;
            margin-bottom: 8px;
        }

        .app-desc {
            font-size: 14px;
            color: #999999;
        }

        /* 表单区域 */
        .form-section {
            padding: 60px 32px 0;
        }

        .input-wrapper {
            margin-bottom: 20px;
            position: relative;
        }

        .input {
            width: 100%;
            height: 52px;
            padding: 0 16px;
            background-color: #FFFFFF;
            border: 1px solid #E5E5E5;
            border-radius: 12px;
            font-size: 15px;
            color: #333333;
            transition: all 0.3s;
        }

        .input:focus {
            outline: none;
            border-color: #4A90E2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }

        .input::placeholder {
            color: #999999;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            fill: #999;
        }

        .input-with-icon {
            padding-left: 48px;
        }

        .password-wrapper {
            position: relative;
        }

        .eye-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            cursor: pointer;
            fill: #999;
            transition: fill 0.3s;
        }

        .eye-icon:hover {
            fill: #4A90E2;
        }

        /* 忘记密码 */
        .forget-pwd {
            text-align: right;
            margin-bottom: 24px;
        }

        .forget-pwd span {
            font-size: 14px;
            color: #4A90E2;
            cursor: pointer;
        }

        /* 按钮 */
        .btn {
            width: 100%;
            height: 52px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
            color: #FFFFFF;
        }

        .btn-primary:hover:not(.disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(74, 144, 226, 0.3);
        }

        .btn-primary:active:not(.disabled) {
            transform: translateY(0);
        }

        .btn-primary.disabled {
            background: #CCCCCC;
            cursor: not-allowed;
        }

        .btn-outline {
            background-color: transparent;
            color: #4A90E2;
            border: 1px solid #4A90E2;
            margin-top: 16px;
        }

        .btn-outline:hover {
            background-color: rgba(74, 144, 226, 0.05);
        }

        /* 分割线 */
        .divider-text {
            display: flex;
            align-items: center;
            margin: 24px 0;
        }

        .divider-text::before,
        .divider-text::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: #E5E5E5;
        }

        .divider-text span {
            padding: 0 16px;
            font-size: 14px;
            color: #CCCCCC;
        }

        /* 微信登录 */
        .wechat-login-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .wechat-icon {
            width: 20px;
            height: 20px;
        }

        /* 协议区域 */
        .agreement-section {
            padding: 24px 32px;
        }

        .agreement-label {
            display: flex;
            align-items: flex-start;
            font-size: 13px;
            gap: 8px;
        }

        .agreement-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin-top: 2px;
            accent-color: #4A90E2;
        }

        .agreement-text {
            color: #666666;
        }

        .agreement-link {
            color: #4A90E2;
            cursor: pointer;
        }

        .agreement-link:hover {
            text-decoration: underline;
        }

        /* 注册区域 */
        .register-section {
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .register-text {
            font-size: 14px;
            color: #666666;
        }

        .register-link {
            font-size: 14px;
            color: #4A90E2;
            cursor: pointer;
        }

        .register-link:hover {
            text-decoration: underline;
        }

        /* 提示框 */
        .toast {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 16px 24px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 100;
        }

        .toast.show {
            opacity: 1;
        }

        /* 响应式 */
        @media (max-width: 400px) {
            .phone-container {
                width: 100%;
                height: 100vh;
                margin: 0;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <!-- 状态栏 -->
        <div class="status-bar">
            <span>9:41</span>
            <span>📶 🔋</span>
        </div>

        <!-- Logo区域 -->
        <div class="logo-section">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 48 48">
                    <path d="M24 4C12.95 4 4 12.95 4 24s8.95 20 20 20 20-8.95 20-20S35.05 4 24 4zm0 6c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6 2.69-6 6-6zm0 28c-5.52 0-10.37-2.82-13.21-7.13C15.61 27.12 19.68 26 24 26s8.39 1.12 13.21 4.87C34.37 35.18 29.52 38 24 38z"/>
                </svg>
            </div>
            <div class="app-name">病历传输</div>
            <div class="app-desc">医疗数据快速传输工具</div>
        </div>

        <!-- 表单区域 -->
        <div class="form-section">
            <!-- 账号输入 -->
            <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
                <input type="text" class="input input-with-icon" id="account" placeholder="请输入手机号/账号" maxlength="30">
            </div>

            <!-- 密码输入 -->
            <div class="input-wrapper password-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24">
                    <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                </svg>
                <input type="password" class="input input-with-icon" id="password" placeholder="请输入密码" maxlength="20">
                <svg class="eye-icon" id="eyeIcon" viewBox="0 0 24 24">
                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
            </div>

            <!-- 忘记密码 -->
            <div class="forget-pwd">
                <span>忘记密码？</span>
            </div>

            <!-- 登录按钮 -->
            <button class="btn btn-primary disabled" id="loginBtn">登 录</button>

            <!-- 分割线 -->
            <div class="divider-text">
                <span>或</span>
            </div>

            <!-- 微信登录 -->
            <button class="btn btn-outline wechat-login-btn" id="wechatLoginBtn">
                <svg class="wechat-icon" viewBox="0 0 24 24">
                    <path fill="#07C160" d="M8.5 12c.83 0 1.5-.67 1.5-1.5S9.33 9 8.5 9 7 9.67 7 10.5 7.67 12 8.5 12zm7 0c.83 0 1.5-.67 1.5-1.5S16.33 9 15.5 9s-1.5.67-1.5 1.5.67 1.5 1.5 1.5zM12 2C6.48 2 2 5.91 2 10c0 2.7 1.66 5.09 4.22 6.56-.11.78-.42 2.12-.93 2.96-.08.13-.05.29.07.38.12.09.29.08.38-.03.8-.97 1.63-2.25 2.06-3.15C9.23 17.37 10.58 17.5 12 17.5c5.52 0 10-3.91 10-8.5S17.52 2 12 2z"/>
                </svg>
                <span>微信一键登录</span>
            </button>
        </div>

        <!-- 协议区域 -->
        <div class="agreement-section">
            <label class="agreement-label">
                <input type="checkbox" id="agreement" checked>
                <span class="agreement-text">我已阅读并同意</span>
                <span class="agreement-link">《用户协议》</span>
                <span class="agreement-text">和</span>
                <span class="agreement-link">《隐私政策》</span>
            </label>
        </div>

        <!-- 注册区域 -->
        <div class="register-section">
            <span class="register-text">还没有账号？</span>
            <span class="register-link">立即注册</span>
        </div>

        <!-- 提示框 -->
        <div class="toast" id="toast"></div>
    </div>

    <script>
        // 获取元素
        const accountInput = document.getElementById('account');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const wechatLoginBtn = document.getElementById('wechatLoginBtn');
        const agreementCheckbox = document.getElementById('agreement');
        const eyeIcon = document.getElementById('eyeIcon');
        const toast = document.getElementById('toast');

        // 状态
        let showPassword = false;
        let agreed = true;

        // 显示提示
        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // 检查是否可以登录
        function checkCanLogin() {
            const account = accountInput.value.trim();
            const password = passwordInput.value;
            const canLogin = account && password.length >= 6 && agreed;

            if (canLogin) {
                loginBtn.classList.remove('disabled');
            } else {
                loginBtn.classList.add('disabled');
            }
        }

        // 账号输入
        accountInput.addEventListener('input', checkCanLogin);

        // 密码输入
        passwordInput.addEventListener('input', checkCanLogin);

        // 切换密码显示
        eyeIcon.addEventListener('click', () => {
            showPassword = !showPassword;
            passwordInput.type = showPassword ? 'text' : 'password';
            eyeIcon.style.fill = showPassword ? '#4A90E2' : '#999';
        });

        // 协议勾选
        agreementCheckbox.addEventListener('change', (e) => {
            agreed = e.target.checked;
            checkCanLogin();
        });

        // 登录按钮
        loginBtn.addEventListener('click', () => {
            if (loginBtn.classList.contains('disabled')) return;

            if (!agreed) {
                showToast('请先同意用户协议和隐私政策');
                return;
            }

            const account = accountInput.value.trim();
            const password = passwordInput.value;

            // 表单验证
            if (!account) {
                showToast('请输入手机号或账号');
                return;
            }

            if (password.length < 6) {
                showToast('密码长度不能少于6位');
                return;
            }

            // 登录成功提示
            showToast('登录成功！');
            setTimeout(() => {
                showToast('即将跳转到首页...');
            }, 1500);
        });

        // 微信登录
        wechatLoginBtn.addEventListener('click', () => {
            if (!agreed) {
                showToast('请先同意用户协议和隐私政策');
                return;
            }
            showToast('微信登录功能开发中...');
        });

        // 忘记密码
        document.querySelector('.forget-pwd span').addEventListener('click', () => {
            showToast('跳转到找回密码页...');
        });

        // 立即注册
        document.querySelector('.register-link').addEventListener('click', () => {
            showToast('跳转到注册页...');
        });

        // 协议链接
        document.querySelectorAll('.agreement-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.stopPropagation();
                const type = link.textContent.includes('用户协议') ? '用户协议' : '隐私政策';
                showToast(`查看${type}`);
            });
        });
    </script>
</body>
</html>
