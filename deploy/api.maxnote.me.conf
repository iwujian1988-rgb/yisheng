# 小科打字猿 API 子域名 server block
# 用法：
#   sudo cp api.maxnote.me.conf /etc/nginx/conf.d/
#   sudo certbot --nginx -d api.maxnote.me
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name api.maxnote.me;

    # Let's Encrypt 续期 webroot
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    # 其余 HTTP 请求 301 到 HTTPS（certbot 会自动加 HTTPS server 块）
    location / {
        return 301 https://$host$request_uri;
    }
}

