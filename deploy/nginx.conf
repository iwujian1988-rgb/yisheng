# 小科打字猿 Nginx 反代配置
# 域名：maxnote.me
# 证书：Let's Encrypt（首次用 certbot standalone 签发，续期用 webroot 模式）

upstream yisheng_api {
  server 127.0.0.1:8080;
  keepalive 32;
}

server {
  listen 80;
  server_name maxnote.me;

  # Let's Encrypt 续期验证目录（HTTP challenge 必须走 80 不重定向）
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    access_log off;
  }

  # 其余 HTTP 请求全部 301 到 HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name maxnote.me;

  ssl_certificate     /etc/letsencrypt/live/maxnote.me/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/maxnote.me/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;

  # 微信小程序上传 downloadFile 时长/大小限制放宽
  client_max_body_size 120M;

  # 安全头
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # 健康检查（Nginx 自身）
  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok\n';
  }

  # API 反代
  location /api/ {
    proxy_pass http://yisheng_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # SSE 流式接口必需：禁用缓冲
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  # 管理后台静态资源
  location /admin {
    proxy_pass http://yisheng_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    proxy_pass http://yisheng_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
}

# WebSocket 升级映射（按需保留）
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}
