<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文本传输助手管理后台</title>
  <link rel="stylesheet" href="/admin/styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">管理后台</div>
    <button class="nav active" data-view="dashboard">总览</button>
    <button class="nav" data-view="paidUsers">服务用户</button>
    <button class="nav" data-view="devices">设备</button>
    <button class="nav" data-view="templates">模板</button>
    <button class="nav" data-view="templateGuide">模板指南</button>
    <button class="nav" data-view="quickActions">快捷任务</button>
    <button class="nav" data-view="activationCodes">激活码</button>
    <button class="nav" data-view="auditLogs">审计日志</button>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="viewTitle">总览</h1>
        <p id="viewSubTitle">后台 API 联调入口</p>
      </div>
      <div class="account">
        <span id="loginState">未登录</span>
        <button id="logoutBtn" class="ghost">退出</button>
      </div>
    </header>

    <section id="loginPanel" class="panel login-panel">
      <h2>管理员登录</h2>
      <label>账号<input id="accountInput" value="admin"></label>
      <label>密码<input id="passwordInput" type="password" value="ChangeMe123!"></label>
      <button id="loginBtn">登录</button>
      <p class="hint">生产环境请修改默认账号密码，并启用 HTTPS、访问控制和持久化数据库。</p>
    </section>

    <section id="contentPanel" class="content hidden">
      <div id="dashboardView" class="view"></div>
      <div id="paidUsersView" class="view hidden"></div>
      <div id="devicesView" class="view hidden"></div>
      <div id="templatesView" class="view hidden"></div>
      <div id="templateGuideView" class="view hidden"></div>
      <div id="quickActionsView" class="view hidden"></div>
      <div id="activationCodesView" class="view hidden"></div>
      <div id="auditLogsView" class="view hidden"></div>
    </section>
  </main>

  <script src="/admin/app.js"></script>
</body>
</html>
